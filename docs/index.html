<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotaxi News</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    .card { transition: box-shadow 0.15s ease; }
    .summary-html p { margin-bottom: 0.5em; }
    .summary-html p:last-child { margin-bottom: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
<header class="bg-white border-b border-gray-200 sticky top-0 z-20">
  <div class="max-w-4xl mx-auto px-4">
    <div class="flex items-center justify-between py-3">
      <h1 class="text-lg font-bold text-gray-900 tracking-tight">Robotaxi News</h1>
      <nav class="flex gap-1">
        <button id="tab-daily" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors" onclick="switchTab('daily')">每日精选</button>
        <button id="tab-selections" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors" onclick="switchTab('selections')">周报选稿</button>
        <button id="tab-weekly" class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors" onclick="switchTab('weekly')">周报</button>
      </nav>
    </div>

    <div id="daily-filters" class="pb-2 flex flex-wrap gap-2 items-center">
      <select id="filter-date" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="applyFilters()">
        <option value="">全部日期</option>
      </select>
      <div class="relative" id="company-dropdown-wrapper">
        <button id="company-dropdown-btn" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center gap-1" onclick="toggleCompanyDropdown()">
          <span id="company-btn-label">全部公司</span>
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="company-dropdown" class="hidden absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-30 min-w-40 max-h-56 overflow-y-auto p-1"></div>
      </div>
      <select id="filter-group" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="applyFilters()">
        <option value="">全部地区</option>
        <option value="国内">国内</option>
        <option value="海外">海外</option>
      </select>
      <button id="clear-filters-btn" class="hidden text-sm text-blue-500 hover:text-blue-700 px-1" onclick="clearFilters()">清除筛选</button>
    </div>
    <div id="daily-active-filters" class="hidden pb-3 flex flex-wrap gap-2"></div>

    <div id="weekly-filters" class="hidden pb-3">
      <div class="flex flex-wrap items-center gap-2">
        <select id="filter-week" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="onWeekChange()">
          <option value="">选择周次</option>
        </select>
        <div class="inline-flex rounded-lg border border-gray-200 bg-white p-0.5">
          <button id="view-classic" class="px-3 py-1 text-xs rounded-md transition-colors" onclick="setWeeklyView('classic')">经典样式</button>
          <button id="view-report" class="px-3 py-1 text-xs rounded-md transition-colors" onclick="setWeeklyView('report')">报告样式</button>
        </div>
        <button id="weekly-edit-btn" onclick="toggleWeeklyEditMode()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg bg-white text-gray-600 hover:bg-gray-50 transition-colors">编辑周报</button>
        <button id="weekly-png-btn" onclick="generateWeeklyPNG()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg bg-white text-gray-600 hover:bg-gray-50 transition-colors">生成 PNG</button>
        <div id="weekly-version-toggle" class="hidden inline-flex rounded-lg border border-amber-200 bg-amber-50 p-0.5">
          <button id="ver-btn-original" onclick="setWeekVersion('original')" class="px-2.5 py-1 text-xs rounded-md transition-colors text-amber-700 hover:bg-amber-100">原版</button>
          <button id="ver-btn-edited" onclick="setWeekVersion('edited')" class="px-2.5 py-1 text-xs rounded-md transition-colors bg-amber-400 text-white">已编辑</button>
        </div>
      </div>
      <div id="weekly-active-filters" class="hidden mt-2 flex flex-wrap gap-2"></div>
    </div>

    <div id="selections-filters" class="hidden pb-3">
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm text-gray-600">日期范围</label>
        <input type="date" id="sel-date-from" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="renderSelections()">
        <span class="text-sm text-gray-400">—</span>
        <input type="date" id="sel-date-to" class="text-sm border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="renderSelections()">
        <button onclick="renderSelections()" class="px-3 py-1.5 text-sm bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">刷新</button>
      </div>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-6">
  <div id="daily-content"></div>
  <div id="weekly-content" class="hidden"></div>
  <div id="selections-content" class="hidden"></div>
</main>

<script>
let dailyData = [];
let weeklyData = [];
let selectionsData = {};
let pendingSelections = {};
let selectedCompanies = new Set();
let currentTab = 'daily';
let weeklyView = 'classic';

const GH_OWNER = 'qlqymzhybmr';
const GH_REPO = 'robotaxi-news';
const SELECTIONS_PATH = 'docs/data/selections.json';
const WEEKLY_OVERRIDES_PATH = 'docs/data/weekly_overrides.json';

let weeklyOverridesData = {};  // { week_id: week_object }
let weeklyDisplayVersion = 'edited'; // 'edited' | 'original'
let editWeekData = null;
let weeklyEditMode = false;
let undoStack = [];
let weeklyEditKeyHandler = null;
let weeklyPasteHandler = null;
let weeklyImgClickHandler = null;
let selectedEditImg = null;

async function init() {
  if (location.hash.startsWith('#weekly')) currentTab = 'weekly';
  else if (location.hash.startsWith('#selections')) currentTab = 'selections';
  const [d, w, s, wo] = await Promise.all([fetchJSON('data/daily.json'), fetchJSON('data/weekly.json'), fetchJSON('data/selections.json'), fetchJSON('data/weekly_overrides.json')]);
  dailyData = Array.isArray(d) ? d : [];
  weeklyData = Array.isArray(w) ? w : [];
  selectionsData = (s && typeof s === 'object' && !Array.isArray(s)) ? s : {};
  const woArr = Array.isArray(wo) ? wo : [];
  woArr.forEach((e) => { if (e && e.week_id) weeklyOverridesData[e.week_id] = e; });
  pendingSelections = JSON.parse(JSON.stringify(selectionsData));
  buildDateFilter();
  buildCompanyFilter();
  buildWeekFilter();
  initSelectionsDates();
  applyTabUI();
  if (currentTab === 'daily') restoreDailyHash();
  else if (currentTab === 'weekly') restoreWeeklyHash();
  else renderSelections();
}

async function fetchJSON(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return [];
    return await res.json();
  } catch {
    return [];
  }
}

function switchTab(tab) {
  currentTab = tab;
  applyTabUI();
  if (tab === 'daily') applyFilters();
  else if (tab === 'weekly') renderWeekly();
  else renderSelections();
}

function applyTabUI() {
  const isDaily = currentTab === 'daily';
  const isWeekly = currentTab === 'weekly';
  const isSelections = currentTab === 'selections';
  document.getElementById('daily-filters').classList.toggle('hidden', !isDaily);
  document.getElementById('daily-content').classList.toggle('hidden', !isDaily);
  document.getElementById('daily-active-filters').classList.toggle('hidden', !isDaily || document.getElementById('daily-active-filters').childElementCount === 0);
  document.getElementById('weekly-filters').classList.toggle('hidden', !isWeekly);
  document.getElementById('weekly-content').classList.toggle('hidden', !isWeekly);
  document.getElementById('selections-filters').classList.toggle('hidden', !isSelections);
  document.getElementById('selections-content').classList.toggle('hidden', !isSelections);
  document.getElementById('tab-daily').className = 'px-4 py-1.5 rounded-full text-sm font-medium transition-colors ' + (isDaily ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100');
  document.getElementById('tab-weekly').className = 'px-4 py-1.5 rounded-full text-sm font-medium transition-colors ' + (isWeekly ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100');
  document.getElementById('tab-selections').className = 'px-4 py-1.5 rounded-full text-sm font-medium transition-colors ' + (isSelections ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100');
  if (isWeekly) updateWeeklyViewUI();
}

function buildDateFilter() {
  const sel = document.getElementById('filter-date');
  const dates = dailyData.map((d) => d.date).sort((a, b) => b.localeCompare(a));
  dates.forEach((date) => {
    const opt = document.createElement('option');
    opt.value = date;
    opt.textContent = formatDate(date);
    sel.appendChild(opt);
  });
}

function buildCompanyFilter() {
  const companies = new Set();
  dailyData.forEach((day) => (day.items || []).forEach((item) => {
    const c = normalizeCompanyName(item.company);
    if (c) companies.add(c);
  }));
  const dropdown = document.getElementById('company-dropdown');
  dropdown.innerHTML = '';
  const allItem = document.createElement('label');
  allItem.className = 'flex items-center gap-2 px-2 py-1.5 rounded hover:bg-gray-50 cursor-pointer text-sm';
  allItem.innerHTML = '<input type="checkbox" id="co-all" class="rounded" onchange="toggleAllCompanies(this)"> All companies';
  dropdown.appendChild(allItem);
  [...companies].sort((a, b) => a.localeCompare(b, 'zh')).forEach((company) => {
    const label = document.createElement('label');
    label.className = 'flex items-center gap-2 px-2 py-1.5 rounded hover:bg-gray-50 cursor-pointer text-sm';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = company;
    cb.className = 'company-cb rounded';
    cb.onchange = onCompanyChange;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(company));
    dropdown.appendChild(label);
  });
}

function buildWeekFilter() {
  const sel = document.getElementById('filter-week');
  const weeks = weeklyData.map((w) => ({ id: w.week_id, label: w.title || w.week_id }));
  weeks.forEach((w) => {
    const opt = document.createElement('option');
    opt.value = w.id;
    opt.textContent = w.label;
    sel.appendChild(opt);
  });
  if (weeks.length > 0) sel.value = weeks[0].id;
}

function toggleCompanyDropdown() {
  document.getElementById('company-dropdown').classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const wrapper = document.getElementById('company-dropdown-wrapper');
  if (wrapper && !wrapper.contains(e.target)) document.getElementById('company-dropdown').classList.add('hidden');
});

function toggleAllCompanies(allCb) {
  const cbs = document.querySelectorAll('.company-cb');
  cbs.forEach((cb) => { cb.checked = allCb.checked; });
  selectedCompanies = allCb.checked ? new Set([...cbs].map((cb) => cb.value)) : new Set();
  updateCompanyBtnLabel();
  applyFilters();
}

function onCompanyChange() {
  selectedCompanies = new Set([...document.querySelectorAll('.company-cb:checked')].map((cb) => cb.value));
  const allCb = document.getElementById('co-all');
  const total = document.querySelectorAll('.company-cb').length;
  if (allCb) allCb.checked = selectedCompanies.size > 0 && selectedCompanies.size === total;
  updateCompanyBtnLabel();
  applyFilters();
}

function updateCompanyBtnLabel() {
  const label = document.getElementById('company-btn-label');
  if (selectedCompanies.size === 0) {
    label.textContent = 'All companies';
  } else {
    label.textContent = String(selectedCompanies.size) + ' selected';
  }
}

function applyFilters() {
  const dateVal = document.getElementById('filter-date').value;
  const groupVal = document.getElementById('filter-group').value;
  const hasFilters = dateVal || groupVal || selectedCompanies.size > 0;
  document.getElementById('clear-filters-btn').classList.toggle('hidden', !hasFilters);
  updateDailyFilterChips(dateVal, groupVal);
  updateHash();
  renderDaily(dateVal, groupVal);
}

function clearFilters() {
  document.getElementById('filter-date').value = '';
  document.getElementById('filter-group').value = '';
  selectedCompanies = new Set();
  document.querySelectorAll('.company-cb').forEach((cb) => { cb.checked = false; });
  const allCb = document.getElementById('co-all');
  if (allCb) allCb.checked = false;
  updateCompanyBtnLabel();
  applyFilters();
}

function updateDailyFilterChips(dateVal, groupVal) {
  const wrap = document.getElementById('daily-active-filters');
  const chips = [];
  if (dateVal) chips.push({ key: 'date', label: formatDate(dateVal) });
  if (groupVal) chips.push({ key: 'group', label: groupVal });
  [...selectedCompanies].forEach((company) => chips.push({ key: `company:${company}`, label: company }));
  wrap.classList.toggle('hidden', chips.length === 0);
  wrap.innerHTML = chips.map((chip) => `<button class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors" onclick="removeDailyChip('${escAttr(chip.key)}')">${escHtml(chip.label)} x</button>`).join('');
}

function removeDailyChip(key) {
  if (key === 'date') document.getElementById('filter-date').value = '';
  if (key === 'group') document.getElementById('filter-group').value = '';
  if (key.startsWith('company:')) {
    selectedCompanies.delete(key.slice('company:'.length));
    document.querySelectorAll('.company-cb').forEach((cb) => { cb.checked = selectedCompanies.has(cb.value); });
    const allCb = document.getElementById('co-all');
    const total = document.querySelectorAll('.company-cb').length;
    if (allCb) allCb.checked = selectedCompanies.size > 0 && selectedCompanies.size === total;
    updateCompanyBtnLabel();
  }
  applyFilters();
}

function renderDaily(dateFilter, groupFilter) {
  const container = document.getElementById('daily-content');
  if (!dailyData || dailyData.length === 0) {
    container.innerHTML = emptyState('No daily data');
    return;
  }
  let days = [...dailyData].sort((a, b) => b.date.localeCompare(a.date));
  if (dateFilter) days = days.filter((d) => d.date === dateFilter);
  let totalShown = 0;
  const sectionsHtml = days.map((day) => {
    let items = [...(day.items || [])];
    if (groupFilter) items = items.filter((i) => i.group === groupFilter);
    if (selectedCompanies.size > 0) items = items.filter((i) => selectedCompanies.has(normalizeCompanyName(i.company)));
    if (items.length === 0) return '';
    items.sort((a, b) => {
      if ((b.rating || 0) !== (a.rating || 0)) return (b.rating || 0) - (a.rating || 0);
      const ga = a.group === '国内' ? 0 : 1;
      const gb = b.group === '国内' ? 0 : 1;
      return ga - gb;
    });
    totalShown += items.length;
    return `<section class="mb-8"><h2 class="text-base font-semibold text-gray-700 mb-3 flex items-center gap-2"><span>${formatDate(day.date)}</span><span class="text-xs font-normal text-gray-400">${items.length} items</span></h2><div class="space-y-3">${items.map((item) => renderCard(item)).join('')}</div></section>`;
  }).join('');
  if (totalShown === 0) {
    container.innerHTML = emptyState('No results');
    return;
  }
  container.innerHTML = `<section class="mb-6 bg-white border border-gray-100 rounded-xl p-4"><div class="flex items-center justify-between gap-3"><div class="text-sm text-gray-500">Results</div><div class="text-sm text-gray-700">Total <span class="font-semibold text-gray-900">${totalShown}</span></div></div></section>${sectionsHtml}`;
}

function renderCard(item) {
  const stars = '*'.repeat(Math.max(0, Number(item.rating || 0)));
  const ratingClass = (item.rating || 0) >= 3 ? 'bg-orange-100 text-orange-700' : 'bg-yellow-50 text-yellow-700';
  return `<article class="card bg-white rounded-xl border border-gray-100 p-4"><div class="flex flex-wrap gap-1.5 mb-3"><span class="px-2 py-0.5 rounded-full text-xs bg-blue-50 text-blue-700 font-medium">${escHtml(item.sub_group || '')}</span><button class="px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-600 font-medium hover:bg-gray-200 transition-colors" onclick="filterByCompany('${escAttr(item.company || '')}')" title="filter company">${escHtml(item.company || '')}</button><span class="px-2 py-0.5 rounded-full text-xs font-medium ${ratingClass}">${stars}</span></div><h3 class="text-gray-900 mb-2 leading-snug font-semibold" style="font-size:18px;">${escHtml(item.company || '')}: ${escHtml(item.title || '')}</h3><div class="summary-html text-sm text-gray-700 leading-relaxed mb-3" style="font-size:15px;">${item.summary_html || ''}</div><div class="flex items-center justify-between border-t border-gray-50 pt-2.5"><a href="${escAttr(item.source_url || '#')}" target="_blank" rel="noopener noreferrer" class="text-xs text-gray-400 hover:text-blue-500 transition-colors">${escHtml(item.source_name || '')} · ${formatDateShort(item.date)} -></a></div></article>`;
}

function filterByCompany(company) {
  const normalized = normalizeCompanyName(company);
  selectedCompanies = normalized ? new Set([normalized]) : new Set();
  document.querySelectorAll('.company-cb').forEach((cb) => { cb.checked = cb.value === normalized; });
  const allCb = document.getElementById('co-all');
  if (allCb) allCb.checked = false;
  updateCompanyBtnLabel();
  applyFilters();
}

function onWeekChange() {
  if (weeklyEditMode) { weeklyEditMode = false; editWeekData = null; updateWeeklyEditBtn(); }
  weeklyDisplayVersion = 'edited';
  updateWeekVersionToggle();
  renderWeekly();
}

function setWeekVersion(v) {
  weeklyDisplayVersion = v;
  updateWeekVersionToggle();
  renderWeekly();
}

function updateWeekVersionToggle() {
  const rawWeekId = document.getElementById('filter-week')?.value;
  const rawWeek = weeklyData.find((w) => w.week_id === rawWeekId) || weeklyData[0];
  const hasOverride = rawWeek && !!weeklyOverridesData[rawWeek.week_id];
  const toggleDiv = document.getElementById('weekly-version-toggle');
  if (!toggleDiv) return;
  if (!hasOverride) { toggleDiv.classList.add('hidden'); return; }
  toggleDiv.classList.remove('hidden');
  const base = 'px-2.5 py-1 text-xs rounded-md transition-colors';
  document.getElementById('ver-btn-original').className = base + (weeklyDisplayVersion === 'original' ? ' bg-amber-400 text-white' : ' text-amber-700 hover:bg-amber-100');
  document.getElementById('ver-btn-edited').className = base + (weeklyDisplayVersion === 'edited' ? ' bg-amber-400 text-white' : ' text-amber-700 hover:bg-amber-100');
}

function setWeeklyView(view) {
  if (weeklyEditMode) { weeklyEditMode = false; editWeekData = null; updateWeeklyEditBtn(); }
  weeklyView = view === 'report' ? 'report' : 'classic';
  updateWeeklyViewUI();
  renderWeekly();
}

function updateWeeklyViewUI() {
  const classicBtn = document.getElementById('view-classic');
  const reportBtn = document.getElementById('view-report');
  classicBtn.className = 'px-3 py-1 text-xs rounded-md transition-colors ' + (weeklyView === 'classic' ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100');
  reportBtn.className = 'px-3 py-1 text-xs rounded-md transition-colors ' + (weeklyView === 'report' ? 'bg-blue-500 text-white' : 'text-gray-600 hover:bg-gray-100');
}

function updateWeeklyFilterChips() {
  const wrap = document.getElementById('weekly-active-filters');
  const weekSel = document.getElementById('filter-week');
  const week = weeklyData.find((w) => w.week_id === weekSel.value) || weeklyData[0];
  const chips = [];
  if (week) chips.push({ key: 'week', label: `Week: ${week.title || week.week_id}` });
  chips.push({ key: 'view', label: weeklyView === 'report' ? 'View: Report' : 'View: Classic' });
  wrap.classList.toggle('hidden', chips.length === 0);
  wrap.innerHTML = chips.map((chip) => `<button class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors" onclick="removeWeeklyChip('${chip.key}')">${escHtml(chip.label)} x</button>`).join('');
}

function removeWeeklyChip(key) {
  if (key === 'view') {
    weeklyView = 'classic';
    updateWeeklyViewUI();
    renderWeekly();
    return;
  }
  if (key === 'week') {
    if (weeklyData.length > 0) document.getElementById('filter-week').value = weeklyData[0].week_id;
    renderWeekly();
  }
}

function renderWeekly() {
  if (weeklyEditMode) return renderWeeklyEdit();
  updateWeekVersionToggle();
  if (weeklyView === 'report') return renderWeeklyReportView();
  return renderWeeklyClassicView();
}

function renderWeeklyClassicView() {
  const container = document.getElementById('weekly-content');
  updateHash();
  updateWeeklyFilterChips();
  const rawWeekId = document.getElementById('filter-week').value;
  const rawWeek = weeklyData.find((w) => w.week_id === rawWeekId) || weeklyData[0];
  if (!rawWeek) return (container.innerHTML = emptyState('No weekly report'));
  const rawOverride = weeklyOverridesData[rawWeek.week_id];
  const week = (weeklyDisplayVersion === 'edited' && rawOverride) ? rawOverride : rawWeek;
  const isOverridden = !!rawOverride;
  const overrideBadge = isOverridden
    ? (weeklyDisplayVersion === 'original'
        ? `<span class="inline-flex items-center gap-1 text-xs bg-gray-100 text-gray-500 border border-gray-200 rounded-full px-2 py-0.5 ml-2">原版</span>`
        : `<span class="inline-flex items-center gap-1 text-xs bg-amber-50 text-amber-600 border border-amber-200 rounded-full px-2 py-0.5 ml-2">✏️ 已手动编辑</span>`)
    : '';
  const generatedAt = week.generated_at ? `<p class="text-sm text-gray-400 mb-6">Generated: ${escHtml(week.generated_at.replace('T', ' ').replace('+08:00', ' +08:00'))}</p>` : '';
  const sectionsHtml = (week.sections || []).map((section) => {
    const entriesHtml = (section.entries || []).map((entry, ei) => {
      const subItemsHtml = (entry.sub_items || []).map((si, sii) =>
        `<div class="flex items-start gap-2 mt-1.5 ml-1 py-0.5">
          <span class="shrink-0 text-sm font-semibold text-gray-500 select-none min-w-[20px]">${String.fromCharCode(96 + sii + 1)}.</span>
          <span class="text-sm text-gray-700 leading-relaxed">${si.content_html || ''}</span>
        </div>`
      ).join('');
      return `<div class="mb-4">
        <div class="flex items-start gap-2 rounded-md px-2.5 py-1.5 bg-blue-50 border-l-2 border-blue-400">
          <span class="shrink-0 text-sm font-bold text-blue-700 select-none min-w-[20px] mt-0.5">${ei + 1}.</span>
          <div class="text-sm font-semibold text-gray-800 leading-relaxed">${entry.headline_html || ''}</div>
        </div>
        <div class="ml-2">${subItemsHtml}</div>
      </div>`;
    }).join('');
    return `<div class="mb-8"><h2 class="text-base font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">${escHtml(section.name)}</h2>${entriesHtml}</div>`;
  }).join('');

function updateHash() {
  if (currentTab === 'daily') {
    const params = new URLSearchParams();
    const date = document.getElementById('filter-date').value;
    const group = document.getElementById('filter-group').value;
    const cos = [...selectedCompanies].join(',');
    if (date) params.set('date', date);
    if (group) params.set('group', group);
    if (cos) params.set('companies', cos);
    location.hash = '#daily' + (params.toString() ? `?${params.toString()}` : '');
  } else {
    const params = new URLSearchParams();
    const week = document.getElementById('filter-week').value;
    if (week) params.set('week', week);
    params.set('view', weeklyView);
    location.hash = '#weekly' + (params.toString() ? `?${params.toString()}` : '');
  }
}

function restoreDailyHash() {
  const hash = location.hash.replace('#daily', '');
  if (!hash.startsWith('?')) return applyFilters();
  const params = new URLSearchParams(hash.slice(1));
  const date = params.get('date');
  const group = params.get('group');
  const companies = params.get('companies');
  if (date) document.getElementById('filter-date').value = date;
  if (group) document.getElementById('filter-group').value = group;
  if (companies) {
    selectedCompanies = new Set(companies.split(',').map(normalizeCompanyName).filter(Boolean));
    document.querySelectorAll('.company-cb').forEach((cb) => { cb.checked = selectedCompanies.has(cb.value); });
    const allCb = document.getElementById('co-all');
    const total = document.querySelectorAll('.company-cb').length;
    if (allCb) allCb.checked = selectedCompanies.size > 0 && selectedCompanies.size === total;
    updateCompanyBtnLabel();
  }
  applyFilters();
}

function restoreWeeklyHash() {
  const hash = location.hash.replace('#weekly', '');
  if (hash.startsWith('?')) {
    const params = new URLSearchParams(hash.slice(1));
    const week = params.get('week');
    const view = params.get('view');
    if (week) document.getElementById('filter-week').value = week;
    if (view) weeklyView = view === 'report' ? 'report' : 'classic';
  }
  updateWeeklyViewUI();
  renderWeekly();
}

function scrollToWeeklySection(id) {
  const section = document.getElementById(id);
  if (!section) return;
  const target = section.querySelector('h2') || section;
  const header = document.querySelector('header');
  const headerHeight = header ? header.getBoundingClientRect().height : 0;
  const targetY = window.pageYOffset + target.getBoundingClientRect().top - headerHeight - 8;
  requestAnimationFrame(() => {
    window.scrollTo({
      top: Math.max(0, targetY),
      behavior: 'smooth',
    });
  });
}

function normalizeCompanyName(name) {
  if (!name) return '';
  return name.replace(/[(][^)]*[)]/g, '').replace(/\s+/g, ' ').trim();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${y}-${m}-${d}`;
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const [, m, d] = dateStr.split('-');
  return `${m}-${d}`;
}

function emptyState(msg) {
  return `<div class="text-center py-20 text-gray-400 text-sm">${escHtml(msg)}</div>`;
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(str) {
  if (!str) return '';
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ─── Weekly Edit Mode ────────────────────────────────────────────────────────

function toggleWeeklyEditMode() {
  if (weeklyEditMode) { exitWeeklyEditMode(); } else { enterWeeklyEditMode(); }
}

function enterWeeklyEditMode() {
  const rawWeekId = document.getElementById('filter-week').value;
  const rawWeek = weeklyData.find((w) => w.week_id === rawWeekId) || weeklyData[0];
  if (!rawWeek) return;
  const rawOverride3 = weeklyOverridesData[rawWeek.week_id];
  const week = (weeklyDisplayVersion === 'edited' && rawOverride3) ? rawOverride3 : rawWeek;
  editWeekData = JSON.parse(JSON.stringify(week));
  weeklyEditMode = true;
  undoStack = [];
  weeklyEditKeyHandler = (e) => {
    if (e.ctrlKey && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      if (document.activeElement && document.activeElement.contentEditable === 'true') return;
      e.preventDefault();
      undoEdit();
    }
  };
  document.addEventListener('keydown', weeklyEditKeyHandler);
  weeklyPasteHandler = handleEditPaste;
  weeklyImgClickHandler = (e) => {
    if (e.target.tagName === 'IMG') {
      e.preventDefault();
      e.stopPropagation();
      selectEditImage(e.target);
    }
  };
  const editContainer = document.getElementById('weekly-content');
  if (editContainer) {
    editContainer.addEventListener('paste', weeklyPasteHandler);
    editContainer.addEventListener('mousedown', weeklyImgClickHandler);
  }
  updateWeeklyEditBtn();
  renderWeeklyEdit();
}

function exitWeeklyEditMode() {
  if (weeklyEditKeyHandler) { document.removeEventListener('keydown', weeklyEditKeyHandler); weeklyEditKeyHandler = null; }
  const editContainer2 = document.getElementById('weekly-content');
  if (weeklyPasteHandler && editContainer2) { editContainer2.removeEventListener('paste', weeklyPasteHandler); weeklyPasteHandler = null; }
  if (weeklyImgClickHandler && editContainer2) { editContainer2.removeEventListener('mousedown', weeklyImgClickHandler); weeklyImgClickHandler = null; }
  const imgTb = document.getElementById('edit-img-toolbar');
  if (imgTb) imgTb.style.display = 'none';
  if (selectedEditImg) { selectedEditImg.style.outline = ''; selectedEditImg = null; }
  undoStack = [];
  editWeekData = null;
  weeklyEditMode = false;
  updateWeeklyEditBtn();
  renderWeekly();
}

function updateWeeklyEditBtn() {
  const btn = document.getElementById('weekly-edit-btn');
  if (!btn) return;
  if (weeklyEditMode) {
    btn.textContent = '取消编辑';
    btn.className = 'px-3 py-1.5 text-sm border border-red-200 rounded-lg bg-white text-red-500 hover:bg-red-50 transition-colors';
  } else {
    btn.textContent = '编辑周报';
    btn.className = 'px-3 py-1.5 text-sm border border-gray-200 rounded-lg bg-white text-gray-600 hover:bg-gray-50 transition-colors';
  }
}

function collectEditWeekDataFromDOM() {
  if (!editWeekData) return;
  document.querySelectorAll('[data-edit-headline]').forEach((el) => {
    const [si, ei] = el.getAttribute('data-edit-headline').split('-').map(Number);
    if (editWeekData.sections[si] && editWeekData.sections[si].entries[ei]) {
      editWeekData.sections[si].entries[ei].headline_html = el.innerHTML.trim();
    }
  });
  document.querySelectorAll('[data-edit-content]').forEach((el) => {
    const [si, ei, sii] = el.getAttribute('data-edit-content').split('-').map(Number);
    const subs = editWeekData.sections[si] && editWeekData.sections[si].entries[ei] && editWeekData.sections[si].entries[ei].sub_items;
    if (subs && subs[sii] !== undefined) subs[sii].content_html = el.innerHTML.trim();
  });
}

function pushUndo() {
  collectEditWeekDataFromDOM();
  undoStack.push(JSON.parse(JSON.stringify(editWeekData)));
  if (undoStack.length > 20) undoStack.shift();
}

function undoEdit() {
  if (!undoStack.length) { showWeeklyEditStatus('info', '已无可撤销的操作'); return; }
  editWeekData = undoStack.pop();
  renderWeeklyEdit();
  const left = undoStack.length;
  showWeeklyEditStatus('info', left > 0 ? `已撤销 · 还可撤销 ${left} 步` : '已撤销 · 无更多历史');
}

function deleteSection(si) {
  pushUndo();
  editWeekData.sections.splice(si, 1);
  renderWeeklyEdit();
}

function deleteEntry(si, ei) {
  pushUndo();
  if (editWeekData.sections[si]) editWeekData.sections[si].entries.splice(ei, 1);
  renderWeeklyEdit();
}

function addSubItem(si, ei) {
  collectEditWeekDataFromDOM();
  const entry = editWeekData && editWeekData.sections[si] && editWeekData.sections[si].entries[ei];
  if (!entry) return;
  if (!entry.sub_items) entry.sub_items = [];
  entry.sub_items.push({ label: '', content_html: '新内容' });

function removeSubItem(si, ei, sii) {
  pushUndo();
  const entry = editWeekData && editWeekData.sections[si] && editWeekData.sections[si].entries[ei];
  if (!entry || !entry.sub_items) return;
  entry.sub_items.splice(sii, 1);

function addEntry(si) {

function handleEditPaste(e) {
  // 1. 优先从 text/html 同步提取 img src URL（从网页复制图片时有效）
  const htmlData = e.clipboardData?.getData('text/html') || '';
  if (htmlData) {
    const match = htmlData.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (match && match[1] && !match[1].startsWith('blob:')) {
      e.preventDefault();
      insertImageAtCursor(match[1]);
      return;
    }
  }
  // 2. 尝试二进制图片数据（截图、从文件复制）
  const items = Array.from(e.clipboardData?.items || []);
  const imageItem = items.find(i => i.type.startsWith('image/'));
  if (imageItem) {
    e.preventDefault();
    imageToBase64AndInsert(imageItem);
  }
}

function imageToBase64AndInsert(clipboardItem) {
  const blob = clipboardItem.getAsFile();
  if (!blob) return;
  const reader = new FileReader();
  reader.onload = (ev) => insertImageAtCursor(ev.target.result);
  reader.readAsDataURL(blob);
}

function insertImageAtCursor(src) {
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = 'max-width:100%;height:auto;display:block;margin:8px 0;border-radius:4px;cursor:pointer;';
  img.title = '点击调整大小';
  const sel = window.getSelection();
  if (sel && sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    range.setStartAfter(img);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

async function saveWeeklyOverride() {
  collectEditWeekDataFromDOM();
  if (!editWeekData) return;
  const token = localStorage.getItem('gh_pat') || '';
  if (!token) { showWeeklyEditStatus('error', '请先在「周报选稿」tab 中填写并保存 GitHub PAT'); return; }
  showWeeklyEditStatus('info', '正在保存到 GitHub…');
  const saveBtn = document.querySelector('#weekly-content button[onclick="saveWeeklyOverride()"]');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中…'; }
  try {
    editWeekData.edited_at = new Date().toISOString();
    weeklyOverridesData[editWeekData.week_id] = editWeekData;
    weeklyDisplayVersion = 'edited';
    updateWeekVersionToggle();
    const overridesArr = Object.values(weeklyOverridesData).sort((a, b) => (b.week_id || '').localeCompare(a.week_id || ''));
    const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${WEEKLY_OVERRIDES_PATH}`;
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    let sha = '';
    const getRes = await fetch(apiBase, { headers });
    if (getRes.ok) { const fd = await getRes.json(); sha = fd.sha || ''; }
    else if (getRes.status !== 404) throw new Error(`GitHub API ${getRes.status}: ${await getRes.text()}`);
    const content = JSON.stringify(overridesArr, null, 2) + '\n';
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const body = { message: `weekly override: ${editWeekData.week_id}`, content: encoded };
    if (sha) body.sha = sha;
    const putRes = await fetch(apiBase, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!putRes.ok) throw new Error(`GitHub API PUT ${putRes.status}: ${await putRes.text()}`);
    showWeeklyEditStatus('success', `✓ ${editWeekData.week_id} 编辑版已保存到 GitHub`);
    if (weeklyEditKeyHandler) { document.removeEventListener('keydown', weeklyEditKeyHandler); weeklyEditKeyHandler = null; }
    undoStack = [];
    weeklyEditMode = false;
    editWeekData = null;
    updateWeeklyEditBtn();
    setTimeout(() => renderWeekly(), 1200);
  } catch (err) {
    showWeeklyEditStatus('error', '保存失败：' + err.message);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存编辑版到 GitHub'; }
  }
}

function showWeeklyEditStatus(type, msg) {
  const el = document.getElementById('weekly-edit-status');
  if (!el) return;
  el.classList.remove('hidden');
  const colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
  el.className = `mb-3 p-3 rounded-lg border text-sm ${colors[type] || colors.info}`;
  el.textContent = msg;
}

// ─── Weekly PNG Generation ────────────────────────────────────────────────────

function loadHtml2Canvas() {
  return new Promise((resolve, reject) => {
    if (window.html2canvas) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('无法加载 html2canvas'));
    document.head.appendChild(s);
  });
}

async function generateWeeklyPNG() {
  const rawWeekId = document.getElementById('filter-week').value;
  const rawWeek = weeklyData.find((w) => w.week_id === rawWeekId) || weeklyData[0];
  if (!rawWeek) { alert('请先选择一个周报'); return; }
  const rawOverride4 = weeklyOverridesData[rawWeek.week_id];
  const week = (weeklyDisplayVersion === 'edited' && rawOverride4) ? rawOverride4 : rawWeek;
  const pngBtn = document.getElementById('weekly-png-btn');
  if (pngBtn) { pngBtn.disabled = true; pngBtn.textContent = '生成中…'; }
  try {
    await loadHtml2Canvas();
    const printDiv = document.createElement('div');
    const YH = '"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",Arial,sans-serif';
    printDiv.style.cssText = `position:fixed;left:-9999px;top:0;width:820px;background:#fff;padding:48px 56px;font-family:${YH};font-size:14px;line-height:1.85;color:#1a1a1a;word-break:break-all;`;
    const sectionsHtml = (week.sections || []).map((section) => {
      const entriesHtml = (section.entries || []).map((entry, idx) => {
        const subs = entry.sub_items || [];
        let bodyHtml = '';
        if (subs.length === 0) {
          bodyHtml = '';
        } else if (subs.length === 1) {
          bodyHtml = `<div style="margin-top:7px;font-size:13px;line-height:1.85;color:#222;font-family:${YH};">${subs[0].content_html || ''}</div>`;
        } else {
          bodyHtml = subs.map((si, sii) =>
            `<div style="display:flex;gap:8px;margin-top:8px;font-size:13px;line-height:1.85;color:#374151;font-family:${YH};padding:2px 0 2px 4px;">
              <span style="flex-shrink:0;font-weight:600;color:#6b7280;min-width:20px;">${String.fromCharCode(96 + sii + 1)}.</span>
              <span>${si.content_html || ''}</span>
            </div>`
          ).join('');
        }
        return `<div style="margin-bottom:20px;font-family:${YH};">
          <div style="display:flex;gap:8px;align-items:flex-start;background:#dbeafe;border-left:3px solid #3b82f6;border-radius:4px;padding:8px 12px;">
            <span style="flex-shrink:0;font-size:14px;font-weight:bold;color:#1d4ed8;min-width:22px;">${idx + 1}.</span>
            <div style="font-size:14px;font-weight:bold;line-height:1.75;color:#1a1a1a;font-family:${YH};">${entry.headline_html || ''}</div>
          </div>
          <div style="padding-left:8px;">${bodyHtml}</div>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:24px;font-family:${YH};">
        <div style="font-size:17px;font-weight:bold;color:#1a1a1a;margin-bottom:16px;font-family:${YH};">${escHtml(section.name)}</div>
        ${entriesHtml}
      </div>`;
    }).join('');
    printDiv.innerHTML = `
      <div style="font-size:22px;font-weight:bold;color:#1a1a1a;border-bottom:3px solid #1d4ed8;padding-bottom:10px;margin-bottom:30px;font-family:${YH};">${escHtml(week.title || week.week_id)}</div>
      ${sectionsHtml}`;
    document.body.appendChild(printDiv);
    const canvas = await html2canvas(printDiv, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', width: 820 });
    document.body.removeChild(printDiv);
    const link = document.createElement('a');
    link.download = `${week.week_id || 'weekly'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    alert('PNG 生成失败：' + err.message);
  } finally {
    if (pngBtn) { pngBtn.disabled = false; pngBtn.textContent = '生成 PNG'; }
  }
}

// ─── Selections tab ──────────────────────────────────────────────────────────

function initSelectionsDates() {
  const today = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const sevenAgo = new Date(today); sevenAgo.setDate(today.getDate() - 6);
  const toEl = document.getElementById('sel-date-to');
  const fromEl = document.getElementById('sel-date-from');
  if (toEl && !toEl.value) toEl.value = fmt(today);
  if (fromEl && !fromEl.value) fromEl.value = fmt(sevenAgo);
}

function getSelDateRange() {
  const from = document.getElementById('sel-date-from').value;
  const to = document.getElementById('sel-date-to').value;
  return { from, to };
}

function getDailyItemsInRange(from, to) {
  const result = [];
  dailyData.forEach((day) => {
    if (day.date >= from && day.date <= to) {
      (day.items || []).forEach((item) => result.push(item));
    }
  });
  return result;
}

function isItemSelected(itemId) {
  const date = itemId.slice(0, 10);
  return (pendingSelections[date] || []).includes(itemId);
}

function toggleItemSelection(itemId, checked) {
  const date = itemId.slice(0, 10);
  if (!pendingSelections[date]) pendingSelections[date] = [];
  if (checked) {
    if (!pendingSelections[date].includes(itemId)) pendingSelections[date].push(itemId);
  } else {
    pendingSelections[date] = pendingSelections[date].filter((id) => id !== itemId);
    if (pendingSelections[date].length === 0) delete pendingSelections[date];
  }
  updateSelSaveBtn();
}

function updateSelSaveBtn() {
  const orig = JSON.stringify(selectionsData);
  const pend = JSON.stringify(pendingSelections);
  const btn = document.getElementById('sel-save-btn');
  if (btn) btn.classList.toggle('opacity-50', orig === pend);
}

function renderSelections() {
  const container = document.getElementById('selections-content');
  const { from, to } = getSelDateRange();
  if (!from || !to) { container.innerHTML = emptyState('请选择日期范围'); return; }

  const items = getDailyItemsInRange(from, to);
  if (items.length === 0) { container.innerHTML = emptyState('该日期范围内暂无每日精选数据'); return; }

  // Group by date
  const byDate = {};
  items.forEach((item) => {
    const d = item.id.slice(0, 10);
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(item);
  });

  const totalSel = items.filter((i) => isItemSelected(i.id)).length;

  const sectionsHtml = Object.keys(byDate).sort((a,b) => b.localeCompare(a)).map((date) => {
    const dayItems = byDate[date].slice().sort((a, b) => (b.rating||0) - (a.rating||0));
    const rows = dayItems.map((item) => {
      const checked = isItemSelected(item.id) ? 'checked' : '';
      const stars = '★'.repeat(Math.max(0, Number(item.rating||0))) + '☆'.repeat(Math.max(0, 3-Number(item.rating||0)));
      const ratingColor = (item.rating||0) >= 3 ? 'text-orange-500' : (item.rating||0) >= 2 ? 'text-yellow-500' : 'text-gray-400';
      return `<label class="flex items-start gap-3 p-3 rounded-lg border border-gray-100 bg-white hover:bg-blue-50 cursor-pointer transition-colors group">
        <input type="checkbox" class="mt-1 w-4 h-4 rounded accent-blue-500 shrink-0" ${checked} onchange="toggleItemSelection('${escAttr(item.id)}', this.checked)">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap gap-1.5 mb-1">
            <span class="text-xs px-1.5 py-0.5 rounded bg-blue-50 text-blue-700">${escHtml(item.sub_group||'')}</span>
            <span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 text-gray-600">${escHtml(item.company||'')}</span>
            <span class="text-xs ${ratingColor} font-medium">${stars}</span>
          </div>
          <p class="text-sm text-gray-800 leading-snug">${escHtml(item.title||'')}</p>
        </div>
      </label>`;
    }).join('');
    const daySel = dayItems.filter((i) => isItemSelected(i.id)).length;
    return `<section class="mb-6">
      <h3 class="text-sm font-semibold text-gray-600 mb-2 flex items-center gap-2">
        <span>${formatDate(date)}</span>
        <span class="text-xs font-normal text-gray-400">${daySel}/${dayItems.length} 已选</span>
      </h3>
      <div class="space-y-2">${rows}</div>
    </section>`;
  }).join('');

  const pat = localStorage.getItem('gh_pat') || '';
  const patMasked = pat ? pat.slice(0,4) + '****' + pat.slice(-4) : '';

  const patBlock = pat
    ? `<div class="flex items-center justify-between px-3 py-2 mb-4 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-500">
        <span>🔑 GitHub PAT 已设置 <span class="font-mono text-xs text-gray-400">${escHtml(patMasked)}</span></span>
        <button onclick="togglePATExpand()" class="text-xs text-blue-500 hover:text-blue-700 underline">修改</button>
       </div>
       <div id="pat-expand" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-sm text-amber-800">
         <div class="flex gap-2">
           <input type="password" id="gh-pat-input" placeholder="ghp_xxxx..." value="${escAttr(pat)}" class="flex-1 border border-amber-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-400">
           <button onclick="savePAT()" class="px-3 py-1 text-sm bg-amber-500 text-white rounded hover:bg-amber-600 transition-colors">保存</button>
         </div>
         <p class="mt-1.5 text-xs text-amber-700">PAT 需要 <code>contents:write</code> 权限（仅本 repo）。<a href="https://github.com/settings/tokens/new" target="_blank" class="underline">创建 PAT</a></p>
       </div>`
    : `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-sm text-amber-800">
        <b>GitHub PAT 设置</b>（一次性，存于 localStorage）：
        <div class="flex gap-2 mt-2">
          <input type="password" id="gh-pat-input" placeholder="ghp_xxxx..." class="flex-1 border border-amber-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-400">
          <button onclick="savePAT()" class="px-3 py-1 text-sm bg-amber-500 text-white rounded hover:bg-amber-600 transition-colors">保存 PAT</button>
        </div>
        <p class="mt-1.5 text-xs text-amber-700">PAT 需要 <code>contents:write</code> 权限（仅本 repo）。<a href="https://github.com/settings/tokens/new" target="_blank" class="underline">创建 PAT</a></p>
       </div>`;

  container.innerHTML = `
    <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
      <div class="text-sm text-gray-600">已选 <span class="font-semibold text-gray-900">${totalSel}</span> / ${items.length} 条</div>
      <button id="sel-save-btn" class="px-4 py-1.5 text-sm bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-medium" onclick="saveSelections()">保存选稿到 GitHub</button>
    </div>
    ${patBlock}
    <div id="sel-status" class="hidden mb-3"></div>
    ${sectionsHtml}
  `;
  updateSelSaveBtn();
}

function togglePATExpand() {
  const el = document.getElementById('pat-expand');
  if (el) el.classList.toggle('hidden');
}

function savePAT() {
  const val = (document.getElementById('gh-pat-input').value || '').trim();
  if (!val) { alert('PAT 不能为空'); return; }
  localStorage.setItem('gh_pat', val);
  renderSelections();
}

async function saveSelections() {
  const token = localStorage.getItem('gh_pat') || '';
  if (!token) { showSelStatus('error', '请先填写并保存 GitHub PAT'); return; }

  showSelStatus('info', '正在保存到 GitHub…');
  const btn = document.getElementById('sel-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }

  try {
    const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${SELECTIONS_PATH}`;
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };

    // Get current file SHA
    let sha = '';
    const getRes = await fetch(apiBase, { headers });
    if (getRes.ok) { const fd = await getRes.json(); sha = fd.sha || ''; }
    else if (getRes.status !== 404) throw new Error(`GitHub API ${getRes.status}: ${await getRes.text()}`);

    const content = JSON.stringify(pendingSelections, null, 2) + '\n';
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const body = { message: 'update selections', content: encoded };
    if (sha) body.sha = sha;

    const putRes = await fetch(apiBase, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!putRes.ok) throw new Error(`GitHub API PUT ${putRes.status}: ${await putRes.text()}`);

    selectionsData = JSON.parse(JSON.stringify(pendingSelections));
    showSelStatus('success', '✓ 选稿已保存到 GitHub（运行 git pull 后可在本地使用）');
  } catch (err) {
    showSelStatus('error', '保存失败：' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '保存选稿到 GitHub'; }
    updateSelSaveBtn();
  }
}

function showSelStatus(type, msg) {
  const el = document.getElementById('sel-status');
  if (!el) return;
  el.classList.remove('hidden');
  const colors = { success: 'bg-green-50 border-green-200 text-green-800', error: 'bg-red-50 border-red-200 text-red-800', info: 'bg-blue-50 border-blue-200 text-blue-800' };
  el.className = `mb-3 p-3 rounded-lg border text-sm ${colors[type] || colors.info}`;
  el.textContent = msg;
}

// ─────────────────────────────────────────────────────────────────────────────

init();
</script>
